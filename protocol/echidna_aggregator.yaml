# Recon Aggregator - Gateway/MultiAdapter messaging layer fuzzing
# Usage: FOUNDRY_PROFILE=echidna echidna . --contract "test/messaging/fuzzing/recon-aggregator/CryticTester.sol:CryticTester" --config echidna_aggregator.yaml --format text --workers 16 --test-limit 100000000
# Pre-build: FOUNDRY_PROFILE=echidna forge build --build-info --force

testMode: "assertion"
coverage: true
corpusDir: "echidna-corpus/aggregator"
balanceAddr: 0x10000
balanceContract: 0x20000
filterBlacklist: true
filterFunctions: []
shrinkLimit: 100000
testLimit: 100000000
seqLen: 200
cryticArgs:
  [
    "--foundry-compile-all",
    "--foundry-ignore-compile",
    "--compile-libraries=(MathLib,0xf01)",
  ]
deployContracts:
  [
    ["0xf01", "MathLib"],
  ]
